[package]
name = "currency-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP server for world currency exchange rates and conversion prompts"
license = "MIT"
keywords = ["mcp", "currency", "exchange-rates", "fx"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
rmcp = { version = "3.1.2", features = ["server", "transport-io", "schemars"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
